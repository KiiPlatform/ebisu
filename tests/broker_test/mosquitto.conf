# The broker tests' broker. with_broker.py puts the files it names in
# /tmp/broker, in the container.
#
# TLS only, with a certificate for localhost issued by a CA of the run's own,
# and one user, whose password is the run's own too.
per_listener_settings false
allow_anonymous false
password_file /tmp/broker/passwd

listener 8883
cafile /tmp/broker/ca.pem
certfile /tmp/broker/server.pem
keyfile /tmp/broker/server.key

# Sessions kept for clients that ask, for as long as the broker runs.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
