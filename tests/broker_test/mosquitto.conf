# The broker tests' broker. with_broker.py puts the files it names in
# /tmp/broker, in the container.
#
# TLS only, with a certificate for localhost issued by a CA of the run's own,
# and one user, whose password is the run's own too. What the user may do, the
# dynamic security plugin says, as dynsec.json has it.
per_listener_settings false
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /tmp/broker/dynsec.json

listener 8883
cafile /tmp/broker/ca.pem
certfile /tmp/broker/server.pem
keyfile /tmp/broker/server.key

# Sessions kept for clients that ask, for as long as the broker runs.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
