# What gcovr reports on, from the coverage preset's build: the libraries' own
# sources, not the tests', the samples' or coreJSON's, which jkii keeps a
# copy of. Run from the repository's root:
#
#   gcovr build/coverage
filter = core/
filter = khc/
filter = kii/
filter = tio/
filter = jkii/src/
filter = platform/
# The program CMake compiles to tell what the compiler is, with the same
# flags, whose source it doesn't keep.
gcov-exclude-directories = .*/CompilerId[^/]*
# jkii is built with strtod() and without, for its tests of each, and its
# _jkii_to_double() is on another line in each: both are reported.
merge-mode-functions = separate
