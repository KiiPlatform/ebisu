name: Build
on:
  workflow_dispatch:
  push:

jobs:
  build:
    permissions:
      contents: write
      checks: write

    # ubuntu-20.04, which this ran on, is no longer offered.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install g++ doxygen cmake libssl-dev git valgrind rsync
      - name: build
        run: make build
      # The small tests only: release/1.3 takes fixes, and the large ones need
      # the live backend.
      - name: test
        run: |
          MEMCHECK=1 JUNIT=1 make stest-khc
          MEMCHECK=1 JUNIT=1 make stest-kii
          MEMCHECK=1 JUNIT=1 make stest-jkii
          MEMCHECK=1 JUNIT=1 make stest-tio
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/test-result.xml"
      - name: build docs
        run: |
          make -C khc clean doc
          make -C kii clean doc
          make -C jkii clean doc
          make -C tio clean doc
      - name: copy docs
        run: |
          mkdir -p ebisu-doc
          rsync -rR --delete khc/html ebisu-doc
          rsync -rR --delete kii/html ebisu-doc
          rsync -rR --delete jkii/html ebisu-doc
          rsync -rR --delete tio/html ebisu-doc
      # The site keeps each major version's docs in its own directory, and
      # 1.x's are this branch's. Only the branch's newest commit deploys them.
      - name: Check this is still release/1.3's head
        id: head
        if: github.ref == 'refs/heads/release/1.3'
        run: |
          if [ "$(git ls-remote origin refs/heads/release/1.3 | cut -f1)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "release/1.3 has moved on; its own run deploys the docs"
          fi
      - name: Deploy docs to GitHub pages
        if: steps.head.outputs.current == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ebisu-doc
          # Only this directory is replaced; the other versions' are kept.
          destination_dir: v1
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
