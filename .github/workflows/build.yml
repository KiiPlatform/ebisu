name: Build
on:
  workflow_dispatch:
  push:

# What a job needs beyond reading the repository it asks for itself, and the
# application's secrets go only to the steps that use them: configuring and
# running the large tests. Everything else here runs tools and third-party
# actions, which have no use for them. They used to be in the environment of
# every step of every job.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # to push the docs to gh-pages
      checks: write # for the JUnit report

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install g++ doxygen cmake libssl-dev git valgrind rsync
      # The same presets developers use, so CI cannot drift from them. Only the
      # JUnit reporting is CI-specific.
      # The large tests are configured when APP_ID and DEFAULT_SITE are set.
      #
      # Tracing is off, whatever the build's default: KHC_TRACE prints every
      # request and response, tokens and passwords included, and ctest prints
      # a failing test's output into this public log.
      - name: configure
        env:
          APP_ID: ${{ secrets.APP_ID }}
          DEFAULT_SITE: ${{ secrets.DEFAULT_SITE }}
        run: cmake --preset debug -DEBISU_TEST_JUNIT=ON -DKHC_TRACE=OFF -DTIO_TRACE=OFF -DEBISU_SOCKET_LOG=OFF
      - name: build
        run: cmake --build --preset debug
      # --test-dir is redundant with --preset for a plain run, but -T memcheck
      # resolves DartConfiguration.tcl relative to the current directory rather
      # than the preset's binaryDir. Without it ctest reads no configuration,
      # reports "Memory checker (MemoryCheckCommand) not set", and exits 16.
      - name: test (small)
        # -T memcheck is the CTest equivalent of the old MEMCHECK=1 valgrind wrapping.
        run: ctest --preset small --test-dir build/debug -T memcheck
      - name: test (large)
        # The large preset retries once: these talk to a live backend and are not
        # deterministic, and without a retry a transient error lands on master as
        # a red build. They take APP_ID and DEFAULT_SITE from the configure, and
        # no other secret: the application's client ID and secret, which the
        # workflow used to give every step, are for 3.0's tests.
        run: ctest --preset large --test-dir build/debug -T memcheck
      - name: Publish Test Report
        # Third-party actions are pinned to a commit, so that a moved tag can't
        # change what runs here.
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
      - name: build docs
        # The Doxyfiles write straight into the publish layout, so there is no
        # longer a copy step reassembling it from per-component html/ output in
        # the source tree.
        run: cmake --build --preset debug --target docs
      - name: Deploy docs to GitHub pages
        # Only master's docs belong on gh-pages; without this any branch push
        # republishes the site.
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          publish_dir: build/debug/ebisu-doc
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ASan and UBSan catch a class of bug valgrind structurally cannot: overruns
  # of globals and string literals live in .rodata, not on the heap or stack.
  # That is how a memcmp reading past a string literal in the JSON parser
  # survived years of green MEMCHECK=1 builds.
  #
  # Small tests only: they are deterministic and need no credentials, so this
  # job stays fast and never touches the live backend.
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install g++ cmake libssl-dev git
      - name: configure
        run: cmake --preset asan
      - name: build
        run: cmake --build --preset asan
      - name: test (small, ASan + UBSan)
        # The preset compiles with -fno-sanitize-recover=all, so a UBSan finding
        # aborts instead of printing a "runtime error" line and passing.
        run: ctest --preset asan-small

  # Every release of the branch's major.minor keeps its ABI: a program built
  # against 2.0.x runs with a later 2.0's libraries. tests/compat_check.sh
  # builds the tree and each of those releases, and abidiff compares their
  # libraries over the public headers. Additions pass; anything else fails.
  abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch tags
        # The releases to compare with, and the version git describes, which
        # says which releases those are.
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        # Each try is bounded, so that a mirror that stalls fails the step
        # rather than hang the job until its timeout.
        run: |
          for try in 1 2 3; do
            sudo timeout 300 apt-get -yq update &&
              sudo timeout 300 apt-get -yq install cmake ninja-build libssl-dev abigail-tools &&
              break
            [ $try -lt 3 ] || exit 1
          done
      - name: ABI against the releases
        run: tests/compat_check.sh
