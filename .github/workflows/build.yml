name: Build
on:
  workflow_dispatch:
  push:

env:
  APP_ID: ${{ secrets.APP_ID }}
  APP_KEY: ${{ secrets.APP_KEY }}
  CLIENT_ID: ${{ secrets.CLIENT_ID }}
  CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
  DEFAULT_SITE: ${{ secrets.DEFAULT_SITE }}

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
      checks: write

    runs-on: ubuntu-latest
    # The large tests run in the large job below, so they are left out of this
    # build: they are configured whenever these are set.
    env:
      APP_ID: ""
      DEFAULT_SITE: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install g++ doxygen cmake libssl-dev git valgrind rsync
      # The same presets developers use, so CI cannot drift from them. Only the
      # JUnit reporting is CI-specific.
      - name: configure
        run: cmake --preset debug -DEBISU_TEST_JUNIT=ON
      - name: build
        run: cmake --build --preset debug
      # --test-dir is redundant with --preset for a plain run, but -T memcheck
      # resolves DartConfiguration.tcl relative to the current directory rather
      # than the preset's binaryDir. Without it ctest reads no configuration,
      # reports "Memory checker (MemoryCheckCommand) not set", and exits 16.
      - name: test (small)
        # -T memcheck is the CTest equivalent of the old MEMCHECK=1 valgrind wrapping.
        run: ctest --preset small --test-dir build/debug -T memcheck
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
      - name: build docs
        # The Doxyfiles write straight into the publish layout, so there is no
        # longer a copy step reassembling it from per-component html/ output in
        # the source tree.
        run: cmake --build --preset debug --target docs
      # The site keeps one set of docs per major version, each from its
      # release/<major>.<minor> branch, so that users of an older version
      # still find its API: release/1.3's under v1/, release/3.0's under v3/.
      # master's are under master/, and docs/index.html, at the root, lists
      # them. Other branches' docs are not published.
      - name: Pick the docs' directory
        id: docs
        run: |
          case "$GITHUB_REF" in
            refs/heads/master)
              echo "dir=master" >> "$GITHUB_OUTPUT" ;;
            refs/heads/release/*)
              release=${GITHUB_REF#refs/heads/release/}
              echo "dir=v${release%%.*}" >> "$GITHUB_OUTPUT" ;;
          esac
      # Merges in quick succession start a run each, whose deploys raced: the
      # first to push won and the others were rejected, failing their runs,
      # with the site left showing whichever commit won. Only the newest
      # commit's docs belong there, so the runs of older ones leave it alone.
      - name: Check this is still the branch's head
        id: head
        if: steps.docs.outputs.dir != ''
        run: |
          if [ "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "${GITHUB_REF_NAME} has moved on; its own run deploys the docs"
          fi
      - name: Deploy docs to GitHub pages
        if: steps.head.outputs.current == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: build/debug/ebisu-doc
          # Only this directory is replaced; the other versions' are kept.
          destination_dir: ${{ steps.docs.outputs.dir }}
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # The site's root holds docs/'s files and the versions' directories, and
      # anything else there is removed: until the docs were versioned,
      # master's were published at the root, and docs/404.html now sends
      # their old URLs to master/. The action above can only keep the whole
      # root or replace it, the versions' directories with it.
      - name: Deploy the docs' index to GitHub pages
        if: github.ref == 'refs/heads/master' && steps.head.outputs.current == 'true'
        run: |
          git fetch --depth 1 origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/pages" FETCH_HEAD
          cd "$RUNNER_TEMP/pages"
          for entry in *; do
            case "$entry" in
              master|v[0-9]*) ;;
              *) git rm -rq -- "$entry" ;;
            esac
          done
          cp "$GITHUB_WORKSPACE"/docs/* .
          git add -A
          if git diff --cached --quiet; then
            echo "the root is up to date"
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -qm "deploy index: $GITHUB_SHA"
            git push origin HEAD:refs/heads/gh-pages
          fi

  # The small tests on 64-bit, and on 32-bit x86, where int and long are both
  # 32 bits as on the ARM Cortex-M targets the samples are for; code that
  # assumes a 64-bit long, or prints a size_t as one, only shows up there.
  # Each in a plain debug build and under ASan + UBSan.
  #
  # And on 64-bit Windows, which is LLP64: long is 32 bits there while pointers
  # and size_t are 64, a combination neither of the others has, so code that
  # keeps a size_t or a pointer in a long passes both and fails only there. That
  # one is cross-compiled with mingw-w64 and run under wine, rather than on a
  # Windows runner, so that it builds with the same CMake presets and GCC
  # warnings as the rest. Its preset builds the win32 sample too, and its small
  # tests include the sample's TLS test, which runs against servers on
  # 127.0.0.1 and so stays within the runner like the others.
  #
  # ASan and UBSan catch a class of bug valgrind structurally cannot: overruns
  # of globals and string literals live in .rodata, not on the heap or stack.
  # That is how a memcmp reading past a string literal in the JSON parser
  # survived years of green MEMCHECK=1 builds.
  #
  # Small tests only: they are deterministic and need no credentials, so these
  # jobs stay fast and never touch the live backend. The build job above runs
  # them under valgrind as well, on 64-bit.
  small:
    name: ${{ matrix.name || format('small ({0}-bit, {1})', matrix.bits, matrix.variant) }}
    runs-on: ubuntu-latest
    # The large tests are configured whenever these are set, and the workflow
    # sets them for every job. This one runs only the small tests, so it leaves
    # the large ones out of the build: they need the secrets, and on Linux link
    # OpenSSL, whose 64-bit headers a -m32 build cannot use.
    env:
      APP_ID: ""
      DEFAULT_SITE: ""
    strategy:
      # One width or platform failing says nothing about another.
      fail-fast: false
      matrix:
        bits: [64, 32]
        variant: [debug, asan]
        include:
          - bits: 64
            variant: debug
            preset: debug
            test-preset: small
          - bits: 64
            variant: asan
            preset: asan
            test-preset: asan-small
          - bits: 32
            variant: debug
            preset: debug-m32
            test-preset: small-m32
          - bits: 32
            variant: asan
            preset: asan-m32
            test-preset: asan-small-m32
          # A cell of its own rather than a third value of bits or variant: it
          # is one debug build, without ASan, which GCC does not provide for
          # mingw-w64. The variant still has to be one the matrix does not
          # list, or this entry would be merged into the four cells above.
          - name: small (64-bit Windows, mingw-w64 + wine)
            bits: 64
            variant: mingw
            preset: mingw
            test-preset: small-mingw
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install g++ cmake libssl-dev git ${{ matrix.bits == 32 && 'gcc-multilib g++-multilib' || '' }}
      # wine64 runs 64-bit .exe files, and wine provides the /usr/bin/wine that
      # the toolchain file names as the emulator. Their recommends add some
      # 230 packages -- GTK, Mesa, GStreamer, fonts -- that a console program
      # has no use for.
      #
      # wineboot creates the wine prefix up front, which the first test would
      # otherwise do inside its own timing, with the other suites starting
      # alongside it. WINEDEBUG=-all, here and in the test preset, quiets
      # wine's complaints that there is no display and no 32-bit wine, neither
      # of which a console program needs.
      #
      # The win32 sample's TLS test runs its servers with python3 and makes its
      # certificates with openssl, and is left out of the build without them.
      # The runner image has both; they are named here so that it cannot
      # quietly stop running.
      - name: Setup mingw-w64 and wine
        if: matrix.variant == 'mingw'
        env:
          WINEDEBUG: -all
        run: |
          sudo apt-get -yq install --no-install-recommends g++-mingw-w64-x86-64-posix wine wine64 python3 openssl
          wineboot --init
      - name: configure
        run: cmake --preset ${{ matrix.preset }}
      - name: build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: test (small)
        # The sanitizer presets compile with -fno-sanitize-recover=all, so a
        # UBSan finding aborts instead of printing a "runtime error" line and
        # passing.
        run: ctest --preset ${{ matrix.test-preset }}

  # The large tests, against the live Kii application the secrets name: on
  # 64-bit Linux under valgrind, and on 64-bit Windows under wine, without
  # valgrind, which cannot run a Windows program. On Windows the tests' sockets
  # are the win32 sample's, Winsock and Schannel, so its TLS runs against the
  # live server too.
  #
  # The two run at once against the same application, as runs for different
  # branches already did. What the tests create they name by the microsecond;
  # otherwise they only log in, as the same identities.
  large:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      # One platform failing says nothing about the other.
      fail-fast: false
      matrix:
        include:
          - name: large (64-bit, valgrind)
            platform: linux
            preset: debug
            # -T memcheck needs --test-dir; see the build job.
            test: ctest --preset large --test-dir build/debug -T memcheck
          - name: large (64-bit Windows, mingw-w64 + wine)
            platform: mingw
            preset: mingw
            test: ctest --preset large-mingw
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install g++ cmake git ${{ matrix.platform == 'linux' && 'libssl-dev valgrind' || '' }}
      # As in the small job. Here the tests also check the server's certificate,
      # with wine's crypt32, which needs a prefix wineboot has finished: one
      # still being written refuses every certificate. wineserver -w waits for
      # it.
      - name: Setup mingw-w64 and wine
        if: matrix.platform == 'mingw'
        env:
          WINEDEBUG: -all
        run: |
          sudo apt-get -yq install --no-install-recommends g++-mingw-w64-x86-64-posix wine wine64
          wineboot --init
          wineserver -w
      - name: configure
        run: cmake --preset ${{ matrix.preset }} -DEBISU_TEST_JUNIT=ON
      - name: build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: test (large)
        # The large presets retry once: these talk to a live backend and are not
        # deterministic, and without a retry a transient error lands on master
        # as a red build.
        run: ${{ matrix.test }}
      - name: valgrind's findings
        # ctest -T memcheck fails on them but prints only their kinds. These
        # logs hold valgrind's own reports and stack traces, none of the tests'
        # output.
        if: failure() && matrix.platform == 'linux'
        run: |
          for f in build/debug/Testing/Temporary/MemoryChecker.*.log; do
            if [ -s "$f" ]; then echo "== $f"; cat "$f"; fi
          done
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (${{ matrix.name }})

  # The embedded samples (GT202, WICED, CC3200) are built with their vendors'
  # tools, from the files their Makefiles copy, and not with CMake. Those SDKs
  # cannot be downloaded here, so this builds what of the samples is ebisu's as
  # their builds do: the same files and include paths, for the boards'
  # Cortex-M4, linked whole so that a source a build leaves out fails. It also
  # checks that the version header their Makefiles write is the one CMake does.
  samples:
    name: samples (Cortex-M4, arm-none-eabi)
    runs-on: ubuntu-latest
    env:
      APP_ID: ""
      DEFAULT_SITE: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install --no-install-recommends cmake gcc-arm-none-eabi libnewlib-arm-none-eabi
      # Only for the header CMake generates, to compare with the samples'.
      - name: configure
        run: cmake --preset debug -DBUILD_TESTING=OFF
      - name: version header
        run: tests/samples/check_version_header.sh build/debug/generated/ebisu_version.h
      - name: build the samples' ebisu sources
        run: tests/samples/cross_build.sh

  # The ESP32 sample, built in Espressif's ESP-IDF image for a board's Wi-Fi and
  # for the Ethernet QEMU emulates, and run in Espressif's QEMU, whose user-mode
  # networking reaches the internet. Built with its clock's floor in 2040, it
  # has to refuse Kii Cloud's certificate as expired. With the secrets, it runs
  # against the live application: it onboards a thing of the run's own, its
  # state reaches the thing's owner, and so do the results of a command the
  # owner sends. See tests/samples/qemu_sample.py.
  esp32:
    name: esp32 sample (ESP-IDF, QEMU)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: tio/esp32-sample
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For git describe, which ebisu_version.h takes the version from.
          fetch-depth: 0
      - name: Trust the checkout
        # The container runs as root, and the checkout is the runner's user's:
        # git would refuse to describe it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: build (Wi-Fi)
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-wifi -D SDKCONFIG=build-wifi/sdkconfig build
      - name: build for QEMU, with the clock's floor in 2040
        run: |
          . "$IDF_PATH/export.sh"
          echo "CONFIG_EBISU_SAMPLE_CLOCK_FLOOR=2208988800" > "$RUNNER_TEMP/refused.cfg"
          idf.py -B build-refused -D SDKCONFIG=build-refused/sdkconfig \
              -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu;$RUNNER_TEMP/refused.cfg" build
          cd build-refused
          python -m esptool --chip esp32 merge_bin --fill-flash-size 4MB -o flash.bin @flash_args
      - name: certificate refused (QEMU)
        run: |
          . "$IDF_PATH/export.sh"
          python ../../tests/samples/qemu_sample.py esp32 refused build-refused/flash.bin
      # The thing's settings, its password included, go into the runner's
      # temporary directory, and the firmware into the build tree, neither of
      # which is uploaded.
      - name: build for QEMU, against the live application
        if: env.CLIENT_ID != ''
        run: |
          . "$IDF_PATH/export.sh"
          python ../../tests/samples/qemu_sample.py esp32 live-config "$RUNNER_TEMP/live.cfg" "$RUNNER_TEMP/live.json"
          idf.py -B build-live -D SDKCONFIG=build-live/sdkconfig \
              -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu;$RUNNER_TEMP/live.cfg" build
          cd build-live
          python -m esptool --chip esp32 merge_bin --fill-flash-size 4MB -o flash.bin @flash_args
      - name: live (QEMU)
        if: env.CLIENT_ID != ''
        run: |
          . "$IDF_PATH/export.sh"
          python ../../tests/samples/qemu_sample.py esp32 live build-live/flash.bin "$RUNNER_TEMP/live.json"

  # The FreeRTOS sample, on FreeRTOS-Plus-TCP and mbedTLS, built for the MPS2
  # AN385 board QEMU emulates, a Cortex-M3 with a LAN9118 Ethernet controller,
  # and run in QEMU, whose user-mode networking reaches the internet. As the
  # ESP32 sample: built with its clock's floor in 2040, it has to refuse Kii
  # Cloud's certificate as expired, and with the secrets it runs against the
  # live application. See tests/samples/qemu_sample.py.
  freertos:
    name: freertos sample (Cortex-M3, QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tio/freertos-sample
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For git describe, which ebisu_version.h takes the version from.
          fetch-depth: 0
      - name: Setup build env
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install --no-install-recommends cmake gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
      - name: build with the clock's floor in 2040
        run: |
          cmake -B build-refused -D EBISU_SAMPLE_CLOCK_FLOOR=2208988800
          cmake --build build-refused -j "$(nproc)"
      - name: certificate refused (QEMU)
        run: python3 ../../tests/samples/qemu_sample.py freertos refused build-refused/ebisu_freertos_sample.elf
      # The thing's settings, its password included, go into the runner's
      # temporary directory, and the firmware into the build tree, neither of
      # which is uploaded.
      - name: build against the live application
        if: env.CLIENT_ID != ''
        run: |
          python3 ../../tests/samples/qemu_sample.py freertos live-config "$RUNNER_TEMP/live.cmake" "$RUNNER_TEMP/live.json"
          cmake -B build-live -C "$RUNNER_TEMP/live.cmake"
          cmake --build build-live -j "$(nproc)"
      - name: live (QEMU)
        if: env.CLIENT_ID != ''
        run: python3 ../../tests/samples/qemu_sample.py freertos live build-live/ebisu_freertos_sample.elf "$RUNNER_TEMP/live.json"
