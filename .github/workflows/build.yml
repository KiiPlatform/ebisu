name: Build
on:
  workflow_dispatch:
  push:

env:
  APP_ID: ${{ secrets.APP_ID }}
  APP_KEY: ${{ secrets.APP_KEY }}
  CLIENT_ID: ${{ secrets.CLIENT_ID }}
  CLIENT_SECRET: ${{ secrets.SECRET }}
  DEFAULT_SITE: ${{ secrets.DEFAULT_SITE }}

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
      checks: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install g++ doxygen cmake libssl-dev git valgrind rsync
      # The same presets developers use, so CI cannot drift from them. Only the
      # JUnit reporting is CI-specific.
      # APP_ID and DEFAULT_SITE come from the job environment; without them the
      # large tests are not configured at all.
      - name: configure
        run: cmake --preset debug -DEBISU_TEST_JUNIT=ON
      - name: build
        run: cmake --build --preset debug
      - name: test (small)
        # -T memcheck is the CTest equivalent of the old MEMCHECK=1 valgrind wrapping.
        run: ctest --preset small -T memcheck
      - name: test (large)
        # The large preset retries once: these talk to a live backend and are not
        # deterministic, and without a retry a transient error lands on master as
        # a red build.
        run: ctest --preset large -T memcheck
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
      - name: build docs
        run: |
          make -C khc clean doc
          make -C kii clean doc
          make -C jkii clean doc
          make -C tio clean doc
      - name: copy docs
        run: |
          mkdir -p ebisu-doc
          rsync -rR --delete khc/html ebisu-doc
          rsync -rR --delete kii/html ebisu-doc
          rsync -rR --delete jkii/html ebisu-doc
          rsync -rR --delete tio/html ebisu-doc
      - name: Deploy docs to GitHub pages
        # Only master's docs belong on gh-pages; without this any branch push
        # republishes the site.
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ebisu-doc
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
