name: Build
on:
  workflow_dispatch:
  push:

# A push to a branch cancels the run of an earlier push to it, which there is
# no point in finishing: the repository runs only so many jobs at a time, and
# the runs share them. Every run of master and of a tag finishes, each in a
# group of its own, as each merge is checked, and master's docs published, on
# its own. A large test cancelled midway leaves what it made in the test
# application, as one that fails can; cleanapp.yml deletes it.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: true

# What a job needs beyond reading the repository it asks for itself, and the
# application's secrets go only to the steps that use them: the large tests and
# the samples' live runs. Everything else here runs third-party actions and
# containers, which have no use for them.
permissions:
  contents: read

# Each job is named in lower case for what it builds or tests, as the tree
# names it, the small or large tests, a port, a sample, or for the target it
# builds them all for. In parentheses comes what tells it from the other jobs
# on the same thing: a version, bare if it is of what the job is named for or
# of what a port is a port to, and after its name if not; the target; and how
# it runs, or that it is only built. A JUnit report is named for its job, the
# parentheses opened: "JUnit Test Report (large, 64-bit, valgrind)".
jobs:
  build:
    name: small (64-bit, valgrind) and docs
    permissions:
      contents: write # to push the docs to gh-pages
      checks: write # for the JUnit report

    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          # libmbedtls-dev for the mbedTLS port, its small tests and its API
          # reference: Ubuntu's, 3.6.
          packages: g++ doxygen cmake libssl-dev libmbedtls-dev git valgrind rsync
      # The same presets developers use, so CI cannot drift from them. Only the
      # JUnit reporting is CI-specific.
      - name: configure
        run: cmake --preset debug -DEBISU_TEST_JUNIT=ON
      - name: build
        run: cmake --build --preset debug --parallel "$(nproc)"
      # --test-dir is redundant with --preset for a plain run, but -T memcheck
      # resolves DartConfiguration.tcl relative to the current directory rather
      # than the preset's binaryDir. Without it ctest reads no configuration,
      # reports "Memory checker (MemoryCheckCommand) not set", and exits 16.
      - name: test (small)
        # -T memcheck is the CTest equivalent of the old MEMCHECK=1 valgrind wrapping.
        run: ctest --preset small --test-dir build/debug -T memcheck
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (small, 64-bit, valgrind)
      - name: build docs
        # The Doxyfiles write straight into the publish layout, so there is no
        # longer a copy step reassembling it from per-component html/ output in
        # the source tree.
        run: cmake --build --preset debug --target docs --parallel "$(nproc)"
      # The site keeps one set of docs per major version, each from its
      # release/<major>.<minor> branch, so that users of an older version
      # still find its API: release/1.3's under v1/, release/3.0's under v3/.
      # master's are under master/, and docs/index.html, at the root, lists
      # them. Other branches' docs are not published.
      - name: Pick the docs' directory
        id: docs
        run: |
          case "$GITHUB_REF" in
            refs/heads/master)
              echo "dir=master" >> "$GITHUB_OUTPUT" ;;
            refs/heads/release/*)
              release=${GITHUB_REF#refs/heads/release/}
              echo "dir=v${release%%.*}" >> "$GITHUB_OUTPUT" ;;
          esac
      # Merges in quick succession start a run each, whose deploys raced: the
      # first to push won and the others were rejected, failing their runs,
      # with the site left showing whichever commit won. Only the newest
      # commit's docs belong there, so the runs of older ones leave it alone.
      - name: Check this is still the branch's head
        id: head
        if: steps.docs.outputs.dir != ''
        run: |
          if [ "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "${GITHUB_REF_NAME} has moved on; its own run deploys the docs"
          fi
      - name: Deploy docs to GitHub pages
        if: steps.head.outputs.current == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          publish_dir: build/debug/ebisu-doc
          # Only this directory is replaced; the other versions' are kept.
          destination_dir: ${{ steps.docs.outputs.dir }}
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # The site's root holds docs/'s files and the versions' directories, and
      # anything else there is removed: until the docs were versioned,
      # master's were published at the root, and docs/404.html now sends
      # their old URLs to master/. The action above can only keep the whole
      # root or replace it, the versions' directories with it.
      - name: Deploy the docs' index to GitHub pages
        if: github.ref == 'refs/heads/master' && steps.head.outputs.current == 'true'
        run: |
          git fetch --depth 1 origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/pages" FETCH_HEAD
          cd "$RUNNER_TEMP/pages"
          for entry in *; do
            case "$entry" in
              master|v[0-9]*) ;;
              *) git rm -rq -- "$entry" ;;
            esac
          done
          cp "$GITHUB_WORKSPACE"/docs/* .
          git add -A
          if git diff --cached --quiet; then
            echo "the root is up to date"
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -qm "deploy index: $GITHUB_SHA"
            git push origin HEAD:refs/heads/gh-pages
          fi

  # The small tests on 64-bit, and on 32-bit x86, where int and long are both
  # 32 bits as on the ARM Cortex-M targets the samples are for; code that
  # assumes a 64-bit long, or prints a size_t as one, only shows up there.
  # On 32-bit, in a plain debug build and under ASan + UBSan; on 64-bit, under
  # ASan + UBSan alone, as the build job above runs them in a plain debug build,
  # under valgrind.
  #
  # And on 64-bit Windows, which is LLP64: long is 32 bits there while pointers
  # and size_t are 64, a combination neither of the others has, so code that
  # keeps a size_t or a pointer in a long passes both and fails only there. That
  # one is cross-compiled with mingw-w64 and run under wine, rather than on a
  # Windows runner, so that it builds with the same CMake presets and GCC
  # warnings as the rest. Its preset builds the win32 sample too, and its small
  # tests include the sample's TLS test, which runs against servers on
  # 127.0.0.1 and so stays within the runner like the others. The msvc job
  # runs that one on Windows as well, and builds all of ebisu there, with
  # Visual Studio's compiler.
  #
  # ASan and UBSan catch a class of bug valgrind structurally cannot: overruns
  # of globals and string literals live in .rodata, not on the heap or stack.
  # That is how a memcmp reading past a string literal in the JSON parser
  # survived years of green MEMCHECK=1 builds.
  #
  # And on 64-bit with -DEBISU_LOG=OFF, which no other job builds all of ebisu
  # with: the libraries and the tests have to compile so without warnings, and
  # the tests that check that a library built so logs nothing run only here.
  # Likewise with -DEBISU_SESSION=OFF, whose test suites leave the sessions'
  # tests out; every build runs kii's tests without sessions as well.
  #
  # Small tests only: they are deterministic and need no credentials, so these
  # jobs stay fast and never touch the live backend.
  small:
    name: ${{ matrix.name || format('small ({0}-bit, {1})', matrix.bits, matrix.variant) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One width or platform failing says nothing about another.
      fail-fast: false
      matrix:
        include:
          - bits: 64
            variant: asan
            preset: asan
            test-preset: asan-small
          - bits: 32
            variant: debug
            preset: debug-m32
            test-preset: small-m32
          - bits: 32
            variant: asan
            preset: asan-m32
            test-preset: asan-small-m32
          # One debug build, without ASan, which GCC does not provide for
          # mingw-w64.
          - name: small (64-bit Windows, mingw-w64 + wine)
            bits: 64
            variant: mingw
            preset: mingw
            test-preset: small-mingw
          - name: small (64-bit, without logging)
            bits: 64
            variant: no-log
            preset: debug
            configure: -DEBISU_LOG=OFF
            test-preset: small
          - name: small (64-bit, without sessions)
            bits: 64
            variant: no-session
            preset: debug
            configure: -DEBISU_SESSION=OFF
            test-preset: small
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: g++ cmake libssl-dev git ${{ matrix.bits == 32 && 'gcc-multilib g++-multilib' || '' }}
      # jkii's tests read numbers in a locale whose decimal point is a comma,
      # and khc's compare header names in a Turkish one, whose i and I aren't
      # each other's case. The runner image has neither. Under wine, Windows
      # has the first already, and no locale of the second kind, which khc's
      # test says.
      - name: Generate the locales the tests use
        if: matrix.variant != 'mingw'
        run: sudo locale-gen de_DE.UTF-8 tr_TR.UTF-8
      # wine64 runs 64-bit .exe files, and wine provides the /usr/bin/wine that
      # the toolchain file names as the emulator. Their recommends add some
      # 230 packages -- GTK, Mesa, GStreamer, fonts -- that a console program
      # has no use for.
      #
      # wineboot creates the wine prefix up front, which the first test would
      # otherwise do inside its own timing, with the other suites starting
      # alongside it. WINEDEBUG=-all, here and in the test preset, quiets
      # wine's complaints that there is no display and no 32-bit wine, neither
      # of which a console program needs.
      #
      # The win32 sample's TLS test runs its servers with python3 and makes its
      # certificates with openssl, and is left out of the build without them.
      # The runner image has both; they are named here so that it cannot
      # quietly stop running.
      - name: Install mingw-w64 and wine
        if: matrix.variant == 'mingw'
        uses: ./.github/actions/apt-install
        with:
          packages: g++-mingw-w64-x86-64-posix wine wine64 python3 openssl
          options: --no-install-recommends
          update: false
      - name: Setup wine
        if: matrix.variant == 'mingw'
        env:
          WINEDEBUG: -all
        run: |
          # Ubuntu 26.04's wine leaves wineserver out of the PATH, where
          # tls_test.py looks for it.
          command -v wineserver > /dev/null || sudo ln -s "$(dpkg -L wine64 | grep -m1 '/wineserver$')" /usr/local/bin/wineserver
          wineboot --init
      - name: configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.configure }}
      - name: build
        run: cmake --build --preset ${{ matrix.preset }} --parallel "$(nproc)"
      - name: test (small)
        # The sanitizer presets compile with -fno-sanitize-recover=all, so a
        # UBSan finding aborts instead of printing a "runtime error" line and
        # passing.
        run: ctest --preset ${{ matrix.test-preset }}

  # All of ebisu built on Windows itself, with Visual Studio's compiler, which
  # is not GCC: it has no variable length arrays, in C or in C++, nor a C99
  # mode, and a DLL exports nothing it isn't told to. The msvc preset names no
  # generator, so CMake takes the newest Visual Studio the runner has. Then the
  # small tests; platform's Schannel port's test, tests/schannel/tls_test.py,
  # with --windows; the large tests, as in the large job, over the Schannel
  # port; and the broker tests, as in the broker job, with Mosquitto on the
  # runner itself.
  #
  # Only these run with Windows' own Schannel, Winsock, DNS client and root
  # store. The small job runs the Schannel port's test under wine, whose
  # Schannel is GnuTLS's underneath, and whose GetAddrInfoExCancel() does
  # nothing, so only here does a lookup the port gives up on get cancelled.
  msvc:
    name: small, large and broker (64-bit Windows, MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # for the JUnit report
    env:
      LIVE: ${{ secrets.CLIENT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      # As in the large job, which configures the large tests when these two
      # are set.
      - name: configure
        env:
          APP_ID: ${{ secrets.APP_ID }}
          DEFAULT_SITE: ${{ secrets.DEFAULT_SITE }}
        run: cmake --preset msvc -DEBISU_TEST_BROKER=ON -DEBISU_TEST_JUNIT=ON
      - name: build
        id: build
        run: cmake --build --preset msvc
      - name: test (small)
        run: ctest --preset small-msvc
      # Whatever the small tests did, as each of the three says something of
      # its own.
      - name: test (Schannel port)
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: python tests/schannel/tls_test.py build/msvc/tests/schannel/Debug/schannel_socket_test.exe --windows
      # As in the large job.
      - name: test (large)
        if: (success() || failure()) && steps.build.outcome == 'success' && (env.LIVE == 'true' || github.ref == 'refs/heads/master')
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: ctest --preset large-msvc
      # The installer mosquitto.org has, of the version the broker job's
      # container is, with the SHA-256 it had when it was pinned here, as
      # mosquitto.org publishes none.
      - name: Install Mosquitto
        id: mosquitto
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: |
          $installer = Join-Path $env:RUNNER_TEMP mosquitto-install.exe
          Invoke-WebRequest https://mosquitto.org/files/binary/win64/mosquitto-2.1.2-install-windows-x64.exe -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne '58008AD7A22ADA0B4073AFA415801746E027C5F583E4FA52D0F4E9193B98D6AA') {
            throw "the installer's SHA-256 is $hash"
          }
          Start-Process $installer -ArgumentList '/S' -Wait
      - name: test (broker)
        if: (success() || failure()) && steps.mosquitto.outcome == 'success'
        run: python tests/broker_test/with_broker.py --windows ctest --preset broker-msvc
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (small, large and broker, 64-bit Windows, MSVC)

  # A short fuzz of everything that reads what the network brings, from the
  # corpus in the repository, so that a change that breaks one of them on input
  # no test thought of fails here. Clang, as GCC has no libFuzzer. Nothing is
  # kept from run to run: the corpus grows by hand, from what a run finds.
  fuzz:
    name: fuzz (libFuzzer, ASan, UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: cmake clang libclang-rt-dev
          options: --no-install-recommends
      - name: configure
        run: cmake --preset fuzz
      - name: build
        run: cmake --build --preset fuzz --parallel "$(nproc)"
      - name: fuzz
        run: tests/fuzz/run.sh 60

  # The mbedTLS port's small tests, under valgrind, against the oldest mbedTLS
  # it supports, 2.4.0, as vendors' SDKs still ship it, the last releases of
  # mbedTLS 2's two LTS lines, 2.16.12 and 2.28.10, 3's LTS, 3.6.7, and the
  # latest, 4.2.0, each built from its release with threads, as
  # tests/mbedtls/install_mbedtls.sh does, and 2.4.0 again without CTR_DRBG and
  # entropy, as some of vendors' SDKs configure it, where the tests give TLS
  # its random generator. Built with -DEBISU_TLS_RESUME=ON, so that they test
  # session resumption too. The build job runs them against Ubuntu's, without
  # it, as by default.
  mbedtls-port:
    name: mbedtls port (${{ matrix.mbedtls }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }}, valgrind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # for the JUnit report
    strategy:
      fail-fast: false
      matrix:
        mbedtls: [2.4.0, 2.16.12, 2.28.10, 3.6.7, 4.2.0]
        variant: ['']
        include:
          - mbedtls: 2.4.0
            variant: no-drbg
          - mbedtls: 2.4.0
            variant: no-aead
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: g++ cmake libssl-dev valgrind python3 perl bzip2 curl
          options: --no-install-recommends
      # The archive, kept from an earlier run: the download has failed a job
      # with a 403 at times. The script checks its hash either way.
      - name: Restore the mbedTLS archive
        uses: actions/cache@v6
        with:
          path: ~/ebisu-downloads
          key: download-mbedtls-${{ matrix.mbedtls }}
      - name: mbedTLS ${{ matrix.mbedtls }} ${{ matrix.variant }}
        run: EBISU_DOWNLOADS="$HOME/ebisu-downloads" tests/mbedtls/install_mbedtls.sh ${{ matrix.mbedtls }} "$RUNNER_TEMP/mbedtls" ${{ matrix.variant }}
      - name: configure
        run: cmake --preset debug -DEBISU_TEST_JUNIT=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/mbedtls" -DEBISU_TLS_RESUME=ON
      - name: build
        run: cmake --build --preset debug --target small_test_mbedtls --parallel "$(nproc)"
      # As the build job's small tests: see there for --test-dir.
      - name: test (valgrind)
        run: ctest --preset small --test-dir build/debug -R '^small_test_mbedtls$' -T memcheck
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (mbedtls port, ${{ matrix.mbedtls }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }}, valgrind)

  # The PolarSSL port's tests, experimental: the mbedTLS port's, against
  # PolarSSL 1.3.8, as vendors' SDKs ship it, mbedTLS 1.3.22, the last of its
  # API, and 1.3.8 without CTR_DRBG and entropy, and without GCM and CCM, where
  # no cipher suite has authenticated encryption, under valgrind. Built with
  # -DEBISU_TLS_RESUME=ON, as the mbedTLS port's are, so that they test
  # session resumption too.
  polarssl-port:
    name: polarssl port (${{ matrix.polarssl }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }}, valgrind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # for the JUnit report
    strategy:
      fail-fast: false
      matrix:
        polarssl: [1.3.8, 1.3.22]
        variant: ['']
        include:
          - polarssl: 1.3.8
            variant: no-drbg
          - polarssl: 1.3.8
            variant: no-aead
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: g++ cmake libssl-dev valgrind python3 curl
          options: --no-install-recommends
      # The archive, kept from an earlier run: the download has failed a job
      # with a 403 at times. The script checks its hash either way.
      - name: Restore the PolarSSL archive
        uses: actions/cache@v6
        with:
          path: ~/ebisu-downloads
          key: download-polarssl-${{ matrix.polarssl }}
      - name: PolarSSL ${{ matrix.polarssl }} ${{ matrix.variant }}
        run: EBISU_DOWNLOADS="$HOME/ebisu-downloads" tests/polarssl/install_polarssl.sh ${{ matrix.polarssl }} "$RUNNER_TEMP/polarssl" ${{ matrix.variant }}
      - name: configure
        run: cmake --preset debug -DEBISU_TEST_JUNIT=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/polarssl" -DEBISU_TLS_RESUME=ON
      - name: build
        run: cmake --build --preset debug --target small_test_polarssl --parallel "$(nproc)"
      # As the build job's small tests: see there for --test-dir.
      - name: test (valgrind)
        run: ctest --preset small --test-dir build/debug -R '^small_test_polarssl$' -T memcheck
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (polarssl port, ${{ matrix.polarssl }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }}, valgrind)

  # Two static analyzers, each following paths through the C of the libraries
  # and the Linux sample for what no test happens to take: leaks, double frees,
  # use after free, null pointers, uninitialized values, a stream read after it
  # failed. What either finds fails the build. Only the build runs: the tests
  # are left out. CodeQL, in codeql.yml, looks for security flaws.
  analyze:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static analysis (clang-tidy)
            preset: tidy
            packages: cmake clang clang-tidy libssl-dev libmbedtls-dev
          - name: static analysis (GCC -fanalyzer)
            preset: analyzer
            packages: gcc cmake libssl-dev libmbedtls-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.packages }}
          options: --no-install-recommends
      - name: configure
        run: cmake --preset ${{ matrix.preset }}
      - name: build
        run: cmake --build --preset ${{ matrix.preset }} --parallel "$(nproc)"

  # What the small tests and the OpenSSL port's own run of the libraries' code,
  # as gcovr.cfg says: the totals and each file's in the job's summary, and
  # each line in the coverage-report artifact. It reports and fails on no
  # figure. The large tests, which need the application and its secrets, are
  # left out, and so is what only they run.
  # Each preset build is given the runner's cores as its parallel level, as
  # the other builds here are: the presets' "jobs": 0 has make run with -j and
  # no number, every compile at once, and the coverage build, the large tests'
  # among it, took the runner's memory, which then stopped answering until the
  # job's timeout, its log never uploaded.
  coverage:
    name: coverage (small, openssl port)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: g++ cmake libssl-dev libmbedtls-dev gcovr
      - name: Generate the locales the tests use
        run: sudo locale-gen de_DE.UTF-8 tr_TR.UTF-8
      - name: configure
        run: cmake --preset coverage
      - name: build
        run: cmake --build --preset coverage --parallel "$(nproc)"
      - name: test (small)
        run: ctest --preset coverage
      - name: test (OpenSSL port)
        working-directory: tests/large_test/kii
        run: ../../../build/coverage/tests/large_test/large_test_kii -# '[#openssl_socket_test]'
      - name: report
        run: |
          mkdir -p build/coverage/coverage-report
          gcovr build/coverage --print-summary --txt build/coverage/coverage.txt \
              --html-details build/coverage/coverage-report/index.html
          {
            echo '## Coverage'
            echo
            echo '```'
            cat build/coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage/coverage-report

  # platform's OpenSSL port supports the OpenSSL of the target devices, which
  # no runner has: 1.0.2p and 1.1.1i are the oldest of each series they ship.
  # And 4.1.0, the newest, which systems such as Homebrew ship. Here each is
  # built from its release tarball, the ports against it, and their tests run.
  # Every other job builds the ports against the runner's own OpenSSL.
  openssl:
    name: posix and openssl ports (OpenSSL ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: [1.0.2p, 1.1.1i, 4.1.0]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: build and test
        # The runners' own mirror of the archive: archive.ubuntu.com, the
        # container's, has sent its files at a few kB/s for an hour at a time.
        env:
          UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu
        run: tests/samples/openssl_ports.sh ${{ matrix.version }}

  # 32-bit ARM Linux, armv7-a with hardware floating point, cross-compiled in
  # Debian stretch against each OpenSSL the job above builds: the libraries,
  # the ports and the Linux sample. The small tests and the OpenSSL port's run
  # under qemu-arm. Stretch's glibc, 2.24, is older than the oldest the targets
  # have, so the job fails if anything needs a symbol newer than GLIBC_2.26.
  armhf:
    name: armhf (OpenSSL ${{ matrix.version }}, qemu-arm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: [1.0.2p, 1.1.1i]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: build and test
        run: tests/samples/armhf.sh ${{ matrix.version }}

  # 32-bit x86 Linux on musl, with Alpine's own OpenSSL, on both sides of musl
  # 1.2.0, which made time_t 64 bits on 32-bit targets.
  musl:
    name: musl (${{ matrix.musl }}, 32-bit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - alpine: '3.12'
            musl: 1.1.24
          - alpine: '3.20'
            musl: 1.2.5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: build and test
        run: tests/samples/musl.sh ${{ matrix.alpine }}

  # What `cmake --install` puts under a prefix, built against: a program finds
  # it through the CMake package and through pkg-config, and runs.
  package:
    name: package (cmake --install, find_package, pkg-config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: build, install and build against it
        run: tests/samples/package_consumer.sh
      # The oldest CMake the project asks for, from PyPI, which still has it.
      - name: the same with CMake 3.15
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake315"
          "$RUNNER_TEMP/cmake315/bin/pip" install --quiet cmake==3.15.3
          EBISU_CMAKE="$RUNNER_TEMP/cmake315/bin/cmake" tests/samples/package_consumer.sh

  # The versioning policy README.md's Packaging section states: the libraries
  # keep the ABI of each release of their X.Y, by abidiff, and the Linux sample
  # of the newest release of an earlier minor version of their major builds
  # against them. Before there is such a release, as while master is becoming
  # 3.0, it checks only that it would notice. See tests/samples/compat_check.sh.
  compat:
    name: versioning policy (abidiff with X.Y's releases, X's API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: abigail-tools
          options: --no-install-recommends
      - name: compare with the releases
        run: tests/samples/compat_check.sh

  # The large tests, against the live Kii application the secrets name, on
  # 64-bit Linux under valgrind. The msvc job runs them on Windows itself, over
  # the Schannel port, so its TLS runs against the live server too.
  #
  # The two run at once against the same application, as runs for different
  # branches already did. What the tests create they name by the microsecond;
  # otherwise they only log in, as the same identities.
  large:
    name: large (64-bit, valgrind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write # for the JUnit report
    env:
      LIVE: ${{ secrets.CLIENT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: g++ cmake git libssl-dev valgrind
      # The large tests are configured when these two are set.
      - name: configure
        env:
          APP_ID: ${{ secrets.APP_ID }}
          DEFAULT_SITE: ${{ secrets.DEFAULT_SITE }}
        run: cmake --preset debug -DEBISU_TEST_JUNIT=ON
      - name: build
        run: cmake --build --preset debug --parallel "$(nproc)"
      # Dependabot's runs and forks' get no secrets, so no large test is
      # configured and ctest fails for want of any. On master it still does:
      # losing the secrets must not look like passing.
      - name: test (large)
        if: env.LIVE == 'true' || github.ref == 'refs/heads/master'
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        # The large presets retry once: these talk to a live backend and are not
        # deterministic, and without a retry a transient error lands on master
        # as a red build. -T memcheck needs --test-dir; see the build job.
        run: ctest --preset large --test-dir build/debug -T memcheck
      - name: valgrind's findings
        # ctest -T memcheck fails on them but prints only their kinds. These
        # logs hold valgrind's own reports and stack traces, none of the tests'
        # output.
        if: failure()
        run: |
          for f in build/debug/Testing/Temporary/MemoryChecker.*.log; do
            if [ -s "$f" ]; then echo "== $f"; cat "$f"; fi
          done
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (large, 64-bit, valgrind)

  # The MQTT task against a Mosquitto broker of the run's own, in a container:
  # what Kii Cloud's broker can't be made to do, or does only now and then. On
  # 64-bit Linux under valgrind, over platform's OpenSSL port. The msvc job runs
  # them on Windows itself, over its Schannel port. They need no secrets, so
  # forks' and Dependabot's runs have them too. See
  # tests/broker_test/with_broker.py.
  broker:
    name: broker (Mosquitto 2.1, valgrind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # for the JUnit report
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: g++ cmake git libssl-dev valgrind
      - name: configure
        run: cmake --preset debug -DEBISU_TEST_BROKER=ON -DEBISU_TEST_JUNIT=ON
      - name: build
        run: cmake --build --preset debug --target broker_test_kii --parallel "$(nproc)"
      - name: test (broker)
        # -T memcheck needs --test-dir; see the build job.
        run: tests/broker_test/with_broker.py ctest --preset broker --test-dir build/debug -T memcheck
      - name: valgrind's findings
        # As in the large job.
        if: failure()
        run: |
          for f in build/debug/Testing/Temporary/MemoryChecker.*.log; do
            if [ -s "$f" ]; then echo "== $f"; cat "$f"; fi
          done
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (broker, Mosquitto 2.1, valgrind)

  # The embedded samples (GT202, CC3200) are built with their vendors'
  # tools, from the files their Makefiles copy, and not with CMake. Those SDKs
  # cannot be downloaded here, so this builds what of the samples is ebisu's as
  # their builds do: the same files and include paths, for the boards'
  # Cortex-M4, linked whole so that a source a build leaves out fails. It also
  # checks that the version header their Makefiles write is the one CMake does,
  # and where both take the version from, and reports the code size of the
  # libraries and of a thing linked with them.
  samples:
    name: cc3200 and gt202 samples (ebisu's sources, Cortex-M4, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch tags
        run: git fetch --unshallow --tags --force
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: cmake gcc-arm-none-eabi libnewlib-arm-none-eabi
          options: --no-install-recommends
      # Only for the header CMake generates, to compare with the samples'.
      - name: configure
        run: cmake --preset debug -DBUILD_TESTING=OFF
      - name: version header
        run: tests/samples/check_version_header.sh build/debug/generated/ebisu_version.h
      - name: version in a source archive
        run: tests/samples/check_archive_version.sh build/debug/generated/ebisu_version.h
      - name: version in a copy, and from version/VERSION
        run: tests/samples/check_version_sources.sh build/debug/generated/ebisu_version.h
      - name: build the samples' ebisu sources
        run: tests/samples/cross_build.sh
      # Into the job's summary: the shared libraries' text built each way, and
      # a thing's for a Cortex-M3, with EBISU_MIN_SIZE and without.
      - name: code size
        run: tests/samples/size_report.sh

  # The ESP32 sample, built in Espressif's ESP-IDF image for a board's Wi-Fi and
  # for the Ethernet QEMU emulates, and run in Espressif's QEMU, whose user-mode
  # networking reaches the internet. Built with its clock's floor in 2040, it
  # has to refuse Kii Cloud's certificate as expired. With the secrets, it runs
  # against the live application: it onboards a thing of the run's own, its
  # state reaches the thing's owner, and so do the results of a command the
  # owner sends. See tests/samples/qemu_sample.py.
  esp32:
    name: esp32 sample (ESP-IDF, QEMU)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    timeout-minutes: 30
    # Whether the secrets are there, as a step's condition can't see them: a
    # fork's pushes run without them.
    env:
      LIVE: ${{ secrets.CLIENT_ID != '' }}
    defaults:
      run:
        shell: bash
        working-directory: tio/esp32-sample
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For git describe, which ebisu_version.h takes the version from.
          fetch-depth: 0
      - name: Trust the checkout
        # The container runs as root, and the checkout is the runner's user's:
        # git would refuse to describe it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: build (Wi-Fi)
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-wifi -D SDKCONFIG=build-wifi/sdkconfig build
      - name: build for QEMU, with the clock's floor in 2040
        run: |
          . "$IDF_PATH/export.sh"
          echo "CONFIG_EBISU_SAMPLE_CLOCK_FLOOR=2208988800" > "$RUNNER_TEMP/refused.cfg"
          idf.py -B build-refused -D SDKCONFIG=build-refused/sdkconfig \
              -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu;$RUNNER_TEMP/refused.cfg" build
          cd build-refused
          python -m esptool --chip esp32 merge_bin --fill-flash-size 4MB -o flash.bin @flash_args
      - name: certificate refused (QEMU)
        run: |
          . "$IDF_PATH/export.sh"
          python ../../tests/samples/qemu_sample.py esp32 refused build-refused/flash.bin
      # The thing's settings, its password included, go into the runner's
      # temporary directory, and the firmware into the build tree, neither of
      # which is uploaded.
      - name: build for QEMU, against the live application
        if: env.LIVE == 'true'
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          DEFAULT_SITE: ${{ secrets.DEFAULT_SITE }}
        run: |
          . "$IDF_PATH/export.sh"
          python ../../tests/samples/qemu_sample.py esp32 live-config "$RUNNER_TEMP/live.cfg" "$RUNNER_TEMP/live.json"
          idf.py -B build-live -D SDKCONFIG=build-live/sdkconfig \
              -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu;$RUNNER_TEMP/live.cfg" build
          cd build-live
          python -m esptool --chip esp32 merge_bin --fill-flash-size 4MB -o flash.bin @flash_args
      - name: live (QEMU)
        if: env.LIVE == 'true'
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          DEFAULT_SITE: ${{ secrets.DEFAULT_SITE }}
        run: |
          . "$IDF_PATH/export.sh"
          python ../../tests/samples/qemu_sample.py esp32 live build-live/flash.bin "$RUNNER_TEMP/live.json"

  # The FreeRTOS sample, on FreeRTOS-Plus-TCP and mbedTLS, built for the MPS2
  # AN385 board QEMU emulates, a Cortex-M3 with a LAN9118 Ethernet controller,
  # and run in QEMU, whose user-mode networking reaches the internet. As the
  # ESP32 sample: built with its clock's floor in 2040, it has to refuse Kii
  # Cloud's certificate as expired, and with the secrets it runs against the
  # live application. See tests/samples/qemu_sample.py.
  freertos:
    name: freertos sample (Cortex-M3, QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # As in the esp32 job.
    env:
      LIVE: ${{ secrets.CLIENT_ID != '' }}
    defaults:
      run:
        working-directory: tio/freertos-sample
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For git describe, which ebisu_version.h takes the version from.
          fetch-depth: 0
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: cmake gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
          options: --no-install-recommends
      - name: build with the clock's floor in 2040
        run: |
          cmake -B build-refused -D EBISU_SAMPLE_CLOCK_FLOOR=2208988800
          cmake --build build-refused -j "$(nproc)"
      - name: certificate refused (QEMU)
        run: python3 ../../tests/samples/qemu_sample.py freertos refused build-refused/ebisu_freertos_sample.elf
      # The thing's settings, its password included, go into the runner's
      # temporary directory, and the firmware into the build tree, neither of
      # which is uploaded.
      - name: build against the live application
        if: env.LIVE == 'true'
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          DEFAULT_SITE: ${{ secrets.DEFAULT_SITE }}
        run: |
          python3 ../../tests/samples/qemu_sample.py freertos live-config "$RUNNER_TEMP/live.cmake" "$RUNNER_TEMP/live.json"
          cmake -B build-live -C "$RUNNER_TEMP/live.cmake"
          cmake --build build-live -j "$(nproc)"
      - name: live (QEMU)
        if: env.LIVE == 'true'
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          DEFAULT_SITE: ${{ secrets.DEFAULT_SITE }}
        run: python3 ../../tests/samples/qemu_sample.py freertos live build-live/ebisu_freertos_sample.elf "$RUNNER_TEMP/live.json"

  # The AmebaZ2 sample, built into a firmware image with Realtek's AmebaZ2 SDK,
  # at a commit of its own, as the SDK builds its example: with its toolchain,
  # FreeRTOS, lwIP and mbedTLS, which ebisu's ports take as the SDK configures
  # them. Nothing emulates the chip, so the image is built only. See
  # tio/amebaz2-sample/README.md.
  amebaz2:
    name: amebaz2 sample (Realtek SDK, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # https://github.com/Ameba-AIoT/ameba-rtos-z2, as of 2026-10-23.
      SDK_COMMIT: 1e5a4adcc8bcbb22984d53269d77ed2fd7a9810b
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For git describe, which ebisu_version.h takes the version from.
          fetch-depth: 0
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          # python-is-python3 for the SDK's scripts, which run python.
          packages: make bc python3 python-is-python3 bzip2 file
          options: --no-install-recommends
      - name: Realtek's AmebaZ2 SDK
        run: |
          git init -q "$RUNNER_TEMP/amebaz2"
          git -C "$RUNNER_TEMP/amebaz2" fetch -q --depth 1 \
              https://github.com/Ameba-AIoT/ameba-rtos-z2 "$SDK_COMMIT"
          git -C "$RUNNER_TEMP/amebaz2" checkout -q FETCH_HEAD
      - name: build
        run: tio/amebaz2-sample/build.sh "$RUNNER_TEMP/amebaz2"

  # The AmebaZ sample, built into the firmware's images with Realtek's SDK for
  # AmebaZ, at a commit of its own, as the SDK builds its example: with its
  # toolchain, FreeRTOS, lwIP, and mbedTLS or PolarSSL, which ebisu's ports
  # take as the SDK configures them. Nothing emulates the chip, so the images
  # are built only.
  # See tio/amebaz-sample/README.md.
  amebaz:
    name: amebaz sample (Realtek SDK, ${{ matrix.library }}, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The SDK's mbedTLS 2.4.0, and its PolarSSL 1.3.8, with ebisu's
        # PolarSSL port, experimental.
        include:
          - tls: mbedtls
            library: mbedTLS 2.4.0
          - tls: polarssl
            library: PolarSSL 1.3.8
    env:
      # https://github.com/Ameba-AIoT/ameba-rtos-1, as of 2022-11-23.
      SDK_COMMIT: 63d54848534113c50e4e78d0ba45359be9ef7e0f
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For git describe, which ebisu_version.h takes the version from.
          fetch-depth: 0
      # The SDK's toolchain is a 32-bit build.
      - name: The 32-bit packages
        run: sudo dpkg --add-architecture i386
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: make gawk bzip2 python3 libc6:i386
          options: --no-install-recommends
      - name: Realtek's AmebaZ SDK
        run: |
          git init -q "$RUNNER_TEMP/amebaz"
          git -C "$RUNNER_TEMP/amebaz" fetch -q --depth 1 \
              https://github.com/Ameba-AIoT/ameba-rtos-1 "$SDK_COMMIT"
          git -C "$RUNNER_TEMP/amebaz" checkout -q FETCH_HEAD
      - name: build
        env:
          EBISU_SAMPLE_TLS: ${{ matrix.tls }}
        run: tio/amebaz-sample/build.sh "$RUNNER_TEMP/amebaz"

  # The FreeRTOS port's tests: a firmware for the same board, run in QEMU by
  # CTest, with FreeRTOS configured four ways, against the oldest kernel the
  # port supports, V8.1.2, which has no static allocation, V9.0.0, V10.0.1,
  # FreeRTOS LTS 202406's, V11.1.0, and the latest. See tests/freertos/README.md.
  freertos-port:
    name: freertos port (${{ matrix.kernel }}, Cortex-M3, QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # for the JUnit report
    strategy:
      fail-fast: false
      matrix:
        kernel: [V8.1.2, V9.0.0, V10.0.1, V11.1.0, V11.3.3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For git describe, which ebisu_version.h takes the version from.
          fetch-depth: 0
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: cmake gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
          options: --no-install-recommends
      - name: ticks of 32 bits, static and dynamic allocation (a)
        if: matrix.kernel != 'V8.1.2'
        run: tests/freertos/run.sh ${{ matrix.kernel }} a
      - name: ticks of 16 bits, dynamic allocation, no INCLUDE_vTaskSuspend (b)
        if: success() || failure()
        run: tests/freertos/run.sh ${{ matrix.kernel }} b
      - name: ticks of 32 bits, static allocation only (c)
        if: (success() || failure()) && matrix.kernel != 'V8.1.2'
        run: tests/freertos/run.sh ${{ matrix.kernel }} c
      - name: ticks of 32 bits, dynamic allocation only (d)
        if: success() || failure()
        run: tests/freertos/run.sh ${{ matrix.kernel }} d
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (freertos port, ${{ matrix.kernel }}, Cortex-M3, QEMU)

  # The lwIP socket's tests, on the runner, with lwIP in the test's own process
  # and servers of the test's own on its loopback interface, configured two
  # ways, against the oldest lwIP the socket supports, 1.4.1, 2.0.2, 2.1.3, and
  # the latest, plain and under valgrind. See tests/lwip/README.md.
  lwip:
    name: lwip socket (${{ matrix.lwip }}, valgrind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # for the JUnit report
    strategy:
      fail-fast: false
      matrix:
        lwip: [1.4.1, 2.0.2, 2.1.3, 2.2.1]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For git describe, which ebisu_version.h takes the version from.
          fetch-depth: 0
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: cmake g++ valgrind
          options: --no-install-recommends
      - name: keepalive's options, IPv4, timeouts of struct timeval from 2.0 on (a)
        run: tests/lwip/run.sh ${{ matrix.lwip }} a
      - name: no keepalive options, timeouts of int ms, poll from 2.1 on, IPv6 from 2.0 on (b)
        if: success() || failure()
        run: tests/lwip/run.sh ${{ matrix.lwip }} b
      - name: a, under valgrind
        if: success() || failure()
        run: tests/lwip/run.sh ${{ matrix.lwip }} a memcheck
      - name: b, under valgrind
        if: success() || failure()
        run: tests/lwip/run.sh ${{ matrix.lwip }} b memcheck
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (lwip socket, ${{ matrix.lwip }}, valgrind)

  # The small tests, tests/small_test's suites, each a firmware for the same
  # board that runs it in a FreeRTOS task, with newlib and its C++ library,
  # run in QEMU by CTest. See tests/freertos_small/README.md.
  freertos-small:
    name: small (FreeRTOS, Cortex-M3, QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # for the JUnit report
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For git describe, which ebisu_version.h takes the version from.
          fetch-depth: 0
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib qemu-system-arm
          options: --no-install-recommends
      - name: Build and run the suites
        run: tests/freertos_small/run.sh
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (small, FreeRTOS, Cortex-M3, QEMU)

  # The large tests, each suite a firmware for the same board that runs it in
  # a FreeRTOS task against the live Kii application the secrets name, over
  # platform's mbedTLS port and its FreeRTOS-Plus-TCP socket, or its lwIP
  # socket, or its PolarSSL port over the lwIP socket, run in QEMU by CTest:
  # on the FreeRTOS sample's kernel, network and TLS, and on those Realtek's
  # SDKs for AmebaZ and AmebaZ2 ship, lwIP, and mbedTLS 2.4.0 or, the AmebaZ's,
  # PolarSSL 1.3.8, configured as they configure them. See
  # tests/freertos_large/README.md.
  freertos-large:
    name: large (FreeRTOS ${{ matrix.kernel }}, ${{ matrix.net }}, ${{ matrix.tls }}, Cortex-M3, QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write # for the JUnit report
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: V11.3.3
            net: FreeRTOS-Plus-TCP V4.4.2
            tls: mbedTLS 3.6.7
            lwip: ''
            library: ''
          # The AmebaZ's, with each of its TLS libraries.
          - kernel: V8.1.2
            net: lwIP 1.4.1
            tls: mbedTLS 2.4.0
            lwip: 1.4.1
            library: mbedtls
          - kernel: V8.1.2
            net: lwIP 1.4.1
            tls: PolarSSL 1.3.8
            lwip: 1.4.1
            library: polarssl
          # The AmebaZ2's.
          - kernel: V10.0.1
            net: lwIP 2.0.2
            tls: mbedTLS 2.4.0
            lwip: 2.0.2
            library: mbedtls
    env:
      LIVE: ${{ secrets.CLIENT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For git describe, which ebisu_version.h takes the version from.
          fetch-depth: 0
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib qemu-system-arm
          options: --no-install-recommends
      # As in the large job: on master, losing the secrets must not look like
      # passing, and run.sh fails without them.
      - name: Build and run the suites
        if: env.LIVE == 'true' || github.ref == 'refs/heads/master'
        env:
          APP_ID: ${{ secrets.APP_ID }}
          DEFAULT_SITE: ${{ secrets.DEFAULT_SITE }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: tests/freertos_large/run.sh ${{ matrix.kernel }} ${{ matrix.lwip }} ${{ matrix.library }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (large, FreeRTOS ${{ matrix.kernel }}, ${{ matrix.net }}, ${{ matrix.tls }}, Cortex-M3, QEMU)

  # The FreeRTOS-Plus-TCP socket's and name servers' tests: a firmware for the
  # same board, run in QEMU against servers on the runner, TCP ones and name
  # servers over UDP, with FreeRTOS-Plus-TCP and the kernel of FreeRTOS LTS
  # 202406, the oldest the socket supports, and the latest, and the latest
  # again with IPv6 and LLMNR, the network still IPv4 only. See
  # tests/freertos_tcp/README.md.
  freertos-tcp:
    name: freertos tcp socket (${{ matrix.plus_tcp }}${{ matrix.ipv6 && ', IPv6' || '' }}, Cortex-M3, QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # for the JUnit report
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: V11.1.0
            plus_tcp: V4.2.6
          - kernel: V11.3.3
            plus_tcp: V4.4.2
          - kernel: V11.3.3
            plus_tcp: V4.4.2
            ipv6: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For git describe, which ebisu_version.h takes the version from.
          fetch-depth: 0
      - name: Setup build env
        uses: ./.github/actions/apt-install
        with:
          packages: cmake gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm python3
          options: --no-install-recommends
      - name: test (QEMU)
        run: tests/freertos_tcp/run.sh ${{ matrix.kernel }} ${{ matrix.plus_tcp }} ${{ matrix.ipv6 && 'ipv6' || '' }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/test-results/junit/*.xml"
          check_name: JUnit Test Report (freertos tcp socket, ${{ matrix.plus_tcp }}${{ matrix.ipv6 && ', IPv6' || '' }}, Cortex-M3, QEMU)
