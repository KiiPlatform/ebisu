# Keeps the actions the workflows and .github/actions pin up to date. It doesn't
# cover the ESP-IDF image a job runs in, whose digest build.yml pins by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # Only versions out for a week: a release that turns out to be broken, or
    # not its authors' own, has usually been found and pulled by then. Security
    # updates don't wait.
    cooldown:
      default-days: 7
